<!DOCTYPE html>
<html>
<head>
  <title>Le choix</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f2f2f2;
    }

    .carte {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: white;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 320px;
    }

    .carte h1 {
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 22px;
    }

    .bouton {
      padding: 12px 25px;
      font-size: 16px;
      background-color: #e63946;
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      display: block;
      width: 100%;
      margin-bottom: 10px;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
    }

    .bouton:hover {
      background-color: #c1121f;
    }

    .reponse {
      font-size: 14px;
      color: #333;
      margin-top: -3px;
      margin-bottom: 15px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="carte">
    <h1>Page contact</h1>

    <button class="bouton" onclick="afficherReponse(1)">Bouton 1</button>
    <p class="reponse" id="reponse1"></p>

    <button class="bouton" onclick="afficherReponse(2)">Bouton 2</button>
    <p class="reponse" id="reponse2"></p>

    <button class="bouton" onclick="afficherReponse(3)">Bouton 3</button>
    <p class="reponse" id="reponse3"></p>
  </div>

  <script>
    const reponses = {
      1: "Réponse pour le bouton 1",
      2: "Réponse pour le bouton 2",
      3: "Réponse pour le bouton 3"
    };

    function afficherReponse(num) {
      document.getElementById("reponse" + num).innerText = reponses[num];
    }
  </script>
</body>
</html>
