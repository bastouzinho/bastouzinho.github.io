<!DOCTYPE html>
<html>
<head>
  <title>Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f2f2f2;
    }

    .carte {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: white;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 320px;
    }

    .carte h1 {
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 22px;
    }

    .bouton {
      padding: 12px 25px;
      font-size: 16px;
      background-color: #e63946;
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      display: block;
      width: 100%;
      margin-bottom: 12px;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
    }

    .bouton:hover {
      background-color: #c1121f;
    }

    .confirmation {
      font-size: 14px;
      color: #2a9d8f;
      margin-top: 5px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="carte">
    <h1>Fais ton choix</h1>

    <button class="bouton" onclick="envoyerChoix('Bouton 1')">Bouton 1</button>
    <button class="bouton" onclick="envoyerChoix('Bouton 2')">Bouton 2</button>
    <button class="bouton" onclick="envoyerChoix('Bouton 3')">Bouton 3</button>

    <p class="confirmation" id="confirmation"></p>
  </div>

  <script>
    const webhookURL = "https://discord.com/api/webhooks/1531118624469815451/MRt4Q1nc97vGlwnvstobqkV1lq6v0eFR9VP8wcr3zI6BaVI1ZgXssF2ePwPxkvBTDj4_";

    function envoyerChoix(choix) {
      fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: "Un visiteur a choisi : " + choix })
      });

      document.getElementById("confirmation").innerText = "Merci, ton choix a bien été envoyé !";
    }
  </script>
</body>
</html>
