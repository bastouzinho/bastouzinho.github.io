<!DOCTYPE html>
<html>
<head>
  <title>Le choix</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #ffb8d1;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('R.png');
      background-repeat: repeat;
      background-size: 90px 90px;
      opacity: 0.3;
      -webkit-mask-image: conic-gradient(#000 90deg, transparent 90deg 180deg, #000 180deg 270deg, transparent 270deg 360deg);
      mask-image: conic-gradient(#000 90deg, transparent 90deg 180deg, #000 180deg 270deg, transparent 270deg 360deg);
      -webkit-mask-size: 180px 180px;
      mask-size: 180px 180px;
      z-index: -1;
    }

    .carte {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: white;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 320px;
    }
    .carte h1 {
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 22px;
    }
    .bouton {
      padding: 12px 25px;
      font-size: 16px;
      background-color: #e63946;
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      display: block;
      width: 100%;
      margin-bottom: 12px;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
    }
    .bouton:hover {
      background-color: #c1121f;
    }
    .confirmation {
      font-size: 14px;
      color: #2a9d8f;
      margin-top: 5px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="carte">
    <h1>Tu me hais a combien sur 10</h1>
    <button class="bouton" onclick="envoyerChoix('1')">1</button>
    <button class="bouton" onclick="envoyerChoix('10')">10</button>
    <button class="bouton" onclick="envoyerChoix('1000')">1000</button>
    <p class="confirmation" id="confirmation"></p>
  </div>
  <script>
    const webhookURL = "https://discord.com/api/webhooks/1531118624469815451/MRt4Q1nc97vGlwnvstobqkV1lq6v0eFR9VP8wcr3zI6BaVI1ZgXssF2ePwPxkvBTDj4_";
    function envoyerChoix(choix) {
      fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: "Un visiteur a choisi : " + choix })
      });
      document.getElementById("confirmation").innerText = "Passe à la suite maintenant";
      setTimeout(function() {
        window.location.href = "suite.html";
      }, 800);
    }
  </script>
</body>
</html>
