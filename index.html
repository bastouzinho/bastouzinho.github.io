<!DOCTYPE html>
<html>
<head>
  <title>Mon site</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #ffb8d1;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('R.png');
      background-repeat: repeat;
      background-size: 90px 90px;
      opacity: 0.3;
      -webkit-mask-image: conic-gradient(#000 90deg, transparent 90deg 180deg, #000 180deg 270deg, transparent 270deg 360deg);
      mask-image: conic-gradient(#000 90deg, transparent 90deg 180deg, #000 180deg 270deg, transparent 270deg 360deg);
      -webkit-mask-size: 180px 180px;
      mask-size: 180px 180px;
      z-index: -1;
    }

    .bandeau-anniv {
      position: relative;
      width: 100%;
      background-color: #f78fb3;
      padding: 25px 15px;
      text-align: center;
      box-sizing: border-box;
      z-index: 1;
    }

    .bandeau-anniv h2 {
      margin: 0;
      font-family: 'Pacifico', cursive;
      font-size: 30px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0 #d6336c;
    }

    .zone-contenu {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 110px);
      padding: 20px 0;
    }

    .carte {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: white;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 300px;
    }
    .carte h1 {
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 24px;
    }
    .bouton {
      padding: 15px 30px;
      font-size: 18px;
      background-color: #e63946;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      display: inline-block;
      font-family: 'Poppins', sans-serif;
    }
    .bouton:hover {
      background-color: #c1121f;
    }
  </style>
</head>
<body>

  <div class="bandeau-anniv">
    <h2>HAPPY BIRTHDAY SHAÏNYS</h2>
  </div>

  <div class="zone-contenu">
    <div class="carte">
      <h1>Clique si je suis le meilleur ex du monde <3 </h1>
      <a href="contact.html" class="bouton">Clique (je sais mv) </a>
    </div>
  </div>

</body>
</html>
