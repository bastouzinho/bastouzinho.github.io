<!DOCTYPE html>
<html>
<head>
  <title>Le jeu</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f2f2f2;
    }

    h1 {
      margin-bottom: 10px;
    }

    #jeu-container {
      position: relative;
      width: 500px;
      height: 200px;
      background-color: #cfe8f3;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    #joueur {
      position: absolute;
      bottom: 0;
      left: 40px;
      width: 30px;
      height: 30px;
      background-color: #e63946;
      border-radius: 5px;
    }

    #obstacle {
      position: absolute;
      bottom: 0;
      right: -20px;
      width: 20px;
      height: 30px;
      background-color: #333;
    }

    #message {
      margin-top: 15px;
      font-size: 18px;
      font-weight: 600;
      min-height: 25px;
    }

    #boutonSaut {
      margin-top: 10px;
      padding: 12px 25px;
      font-size: 16px;
      background-color: #e63946;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #boutonSaut:hover {
      background-color: #c1121f;
    }
  </style>
</head>
<body>

  <h1>Saute pour survivre !</h1>

  <div id="jeu-container">
    <div id="joueur"></div>
    <div id="obstacle"></div>
  </div>

  <p id="message">Appuie sur ESPACE ou clique sur le bouton pour sauter (le son démarre au premier saut)</p>
  <button id="boutonSaut">Sauter</button>

  <div id="zoneVideo"></div>

  <script>
    const joueur = document.getElementById("joueur");
    const obstacle = document.getElementById("obstacle");
    const message = document.getElementById("message");
    const boutonSaut = document.getElementById("boutonSaut");
    const zoneVideo = document.getElementById("zoneVideo");

    let enSaut = false;
    let jeuFini = false;
    let vitesseObstacle = 2;
    let positionObstacle = 500;
    let dureeSurvie = 8000;
    let debut = Date.now();
    let musiqueLancee = false;

    function lancerMusique() {
      if (musiqueLancee) return;
      musiqueLancee = true;
      zoneVideo.innerHTML = '<iframe width="1" height="1" style="border:none;" src="https://www.youtube.com/embed/mjen6N9o5nI?autoplay=1&start=0" allow="autoplay"></iframe>';
    }

    function sauter() {
      lancerMusique();

      if (enSaut || jeuFini) return;
      enSaut = true;
      let hauteur = 0;
      let monte = true;

      const intervalSaut = setInterval(() => {
        if (monte) {
          hauteur += 5;
          if (hauteur >= 90) monte = false;
        } else {
          hauteur -= 5;
          if (hauteur <= 0) {
            hauteur = 0;
            monte = true;
            enSaut = false;
            clearInterval(intervalSaut);
          }
        }
        joueur.style.bottom = hauteur + "px";
      }, 16);
    }

    document.addEventListener("keydown", function(e) {
      if (e.code === "Space") sauter();
    });

    boutonSaut.addEventListener("click", sauter);

    const boucleJeu = setInterval(() => {
      if (jeuFini) return;

      positionObstacle -= vitesseObstacle;
      if (positionObstacle < -20) {
        positionObstacle = 500;
      }
      obstacle.style.right = (500 - positionObstacle) + "px";

      const joueurBottom = parseInt(joueur.style.bottom || "0");
      const collision = positionObstacle < 65 && positionObstacle > 35 && joueurBottom < 25;

      if (collision) {
        jeuFini = true;
        message.innerText = "Perdu ! Recharge la page pour réessayer.";
        clearInterval(boucleJeu);
        return;
      }

      if (Date.now() - debut > dureeSurvie) {
        jeuFini = true;
        message.innerText = "Bravo, tu as gagné !";
        clearInterval(boucleJeu);
      }
    }, 16);
  </script>

</body>
</html>
