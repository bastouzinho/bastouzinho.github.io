<!DOCTYPE html>
<html>
<head>
  <title>Snake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f2f2f2;
    }
    .carte {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .carte h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 22px;
    }
    #score {
      font-size: 16px;
      margin-bottom: 15px;
      color: #333;
    }
    canvas {
      border-radius: 10px;
      margin-bottom: 20px;
      touch-action: none;
      max-width: 90vw;
    }
    #controles {
      display: grid;
      grid-template-columns: 55px 55px 55px;
      grid-template-rows: 55px 55px;
      gap: 8px;
      justify-content: center;
    }
    .fleche {
      font-size: 22px;
      background-color: #e63946;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .fleche:hover { background-color: #c1121f; }
    #haut { grid-column: 2; grid-row: 1; }
    #gauche { grid-column: 1; grid-row: 2; }
    #bas { grid-column: 2; grid-row: 2; }
    #droite { grid-column: 3; grid-row: 2; }
    #messageFin {
      margin-top: 15px;
      font-size: 16px;
      font-weight: 600;
      color: #e63946;
      min-height: 20px;
    }
    #rejouer {
      display: none;
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 15px;
      background-color: #2a9d8f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }
    p.astuce {
      font-size: 13px;
      color: #777;
      margin-top: -10px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div id="lecteurYoutube" style="width:1px; height:1px; overflow:hidden; position:absolute;"></div>

  <div class="carte">
    <h1>Snake</h1>
    <p id="score">Score : 0</p>
    <p class="astuce">Révèle la photo en te déplaçant !</p>

    <canvas id="jeu" width="360" height="360"></canvas>

    <div id="controles">
      <button class="fleche" id="haut">↑</button>
      <button class="fleche" id="gauche">←</button>
      <button class="fleche" id="bas">↓</button>
      <button class="fleche" id="droite">→</button>
    </div>

    <p id="messageFin"></p>
    <button id="rejouer">Rejouer</button>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let apiPrete = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('lecteurYoutube', {
        height: '1',
        width: '1',
        videoId: 'mjen6N9o5nI',
        playerVars: { playsinline: 1 },
        events: {
          'onReady': function() { apiPrete = true; }
        }
      });
    }

    let musiqueLancee = false;
    function lancerMusique() {
      if (musiqueLancee || !apiPrete) return;
      musiqueLancee = true;
      player.playVideo();
    }

    const canvas = document.getElementById("jeu");
    const ctx = canvas.getContext("2d");
    const taille = 20;
    const cases = canvas.width / taille;

    const photo = new Image();
    photo.src = "photo.jpg";
    let photoChargee = false;
    photo.onload = function() {
      photoChargee = true;
      dessiner();
    };

    let serpent, direction, prochaineDirection, pomme, score, jeuFini, intervalJeu, casesRevelees;

    function initJeu() {
      serpent = [{x: 5, y: 5}];
      direction = "droite";
      prochaineDirection = "droite";
      score = 0;
      jeuFini = false;
      casesRevelees = new Set();
      document.getElementById("score").innerText = "Score : 0";
      document.getElementById("messageFin").innerText = "";
      document.getElementById("rejouer").style.display = "none";
      placerPomme();
      if (intervalJeu) clearInterval(intervalJeu);
      intervalJeu = setInterval(boucle, 150);
    }

    function placerPomme() {
      pomme = {
        x: Math.floor(Math.random() * cases),
        y: Math.floor(Math.random() * cases)
      };
      for (let seg of serpent) {
        if (seg.x === pomme.x && seg.y === pomme.y) {
          placerPomme();
          break;
        }
      }
    }

    function boucle() {
      if (jeuFini) return;
      direction = prochaineDirection;

      const tete = { x: serpent[0].x, y: serpent[0].y };
      if (direction === "haut") tete.y--;
      if (direction === "bas") tete.y++;
      if (direction === "gauche") tete.x--;
      if (direction === "droite") tete.x++;

      if (tete.x < 0 || tete.x >= cases || tete.y < 0 || tete.y >= cases) {
        finDuJeu();
        return;
      }
      for (let seg of serpent) {
        if (seg.x === tete.x && seg.y === tete.y) {
          finDuJeu();
          return;
        }
      }

      serpent.unshift(tete);

      if (tete.x === pomme.x && tete.y === pomme.y) {
        score++;
        document.getElementById("score").innerText = "Score : " + score;
        placerPomme();
      } else {
        serpent.pop();
      }

      for (let seg of serpent) {
        casesRevelees.add(seg.x + "," + seg.y);
      }

      dessiner();
    }

    function dessinerPhotoCover() {
      const ratioCanvas = canvas.width / canvas.height;
      const ratioImg = photo.width / photo.height;
      let sx, sy, sw, sh;
      if (ratioImg > ratioCanvas) {
        sh = photo.height;
        sw = sh * ratioCanvas;
        sx = (photo.width - sw) / 2;
        sy = 0;
      } else {
        sw = photo.width;
        sh = sw / ratioCanvas;
        sx = 0;
        sy = (photo.height - sh) / 2;
      }
      ctx.drawImage(photo, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    }

    function dessiner() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (photoChargee) {
        dessinerPhotoCover();
      } else {
        ctx.fillStyle = "#cfe8f3";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.fillStyle = "rgba(20, 20, 30, 0.93)";
      for (let x = 0; x < cases; x++) {
        for (let y = 0; y < cases; y++) {
          if (!casesRevelees.has(x + "," + y)) {
            ctx.fillRect(x * taille, y * taille, taille, taille);
          }
        }
      }

      ctx.fillStyle = "#e63946";
      ctx.fillRect(pomme.x * taille, pomme.y * taille, taille - 2, taille - 2);

      for (let seg of serpent) {
        ctx.strokeStyle = "#e63946";
        ctx.lineWidth = 2;
        ctx.strokeRect(seg.x * taille + 1, seg.y * taille + 1, taille - 4, taille - 4);
      }
    }

    function finDuJeu() {
      jeuFini = true;
      clearInterval(intervalJeu);
      document.getElementById("messageFin").innerText = "Perdu ! Score final : " + score;
      document.getElementById("rejouer").style.display = "inline-block";
    }

    function changerDirection(nouvelleDirection) {
      lancerMusique();
      const opposees = { haut: "bas", bas: "haut", gauche: "droite", droite: "gauche" };
      if (opposees[nouvelleDirection] !== direction) {
        prochaineDirection = nouvelleDirection;
      }
    }

    document.getElementById("haut").addEventListener("click", () => changerDirection("haut"));
    document.getElementById("bas").addEventListener("click", () => changerDirection("bas"));
    document.getElementById("gauche").addEventListener("click", () => changerDirection("gauche"));
    document.getElementById("droite").addEventListener("click", () => changerDirection("droite"));
    document.getElementById("rejouer").addEventListener("click", initJeu);

    document.addEventListener("keydown", function(e) {
      if (e.key === "ArrowUp") changerDirection("haut");
      if (e.key === "ArrowDown") changerDirection("bas");
      if (e.key === "ArrowLeft") changerDirection("gauche");
      if (e.key === "ArrowRight") changerDirection("droite");
    });

    let debutX = 0;
    let debutY = 0;

    canvas.addEventListener("touchstart", function(e) {
      lancerMusique();
      debutX = e.touches[0].clientX;
      debutY = e.touches[0].clientY;
    });

    canvas.addEventListener("touchend", function(e) {
      const finX = e.changedTouches[0].clientX;
      const finY = e.changedTouches[0].clientY;
      const diffX = finX - debutX;
      const diffY = finY - debutY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 20) changerDirection("droite");
        else if (diffX < -20) changerDirection("gauche");
      } else {
        if (diffY > 20) changerDirection("bas");
        else if (diffY < -20) changerDirection("haut");
      }
    });

    initJeu();
  </script>

</body>
</html>
