<!DOCTYPE html>
<html>
<head>
  <title>La lettre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #ffb8d1;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('R.png');
      background-repeat: repeat;
      background-size: 90px 90px;
      opacity: 0.3;
      -webkit-mask-image: conic-gradient(#000 90deg, transparent 90deg 180deg, #000 180deg 270deg, transparent 270deg 360deg);
      mask-image: conic-gradient(#000 90deg, transparent 90deg 180deg, #000 180deg 270deg, transparent 270deg 360deg);
      -webkit-mask-size: 180px 180px;
      mask-size: 180px 180px;
      z-index: -1;
    }

    .carte {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 320px;
    }

    .carte h1 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .scene {
      position: relative;
      width: 260px;
      height: 180px;
      margin: 10px auto 20px auto;
    }

    .enveloppe-corps {
      position: absolute;
      top: 0;
      left: 0;
      width: 260px;
      height: 170px;
      background-color: #fdf3f7;
      border-radius: 6px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .enveloppe-corps::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 90px solid #f7c9dc;
      z-index: 2;
    }

    .enveloppe-corps::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid #f9dce7;
      border-right: 130px solid #f9dce7;
      border-bottom: 60px solid #f3b6cf;
      z-index: 1;
    }

    .rabat {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 100px solid #f78fb3;
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform 0.7s ease;
      z-index: 5;
    }

    .scene.ouvert .rabat {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .sceau {
      position: absolute;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at 35% 30%, #e85d75, #c1121f);
      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 6;
      border: none;
      transition: transform 0.15s ease, opacity 0.3s ease;
    }

    .sceau:active {
      transform: translateX(-50%) scale(0.9);
    }

    .sceau span {
      color: #ffe3e9;
      font-size: 20px;
      font-family: 'Pacifico', cursive;
    }

    .scene.ouvert .sceau {
      opacity: 0;
      pointer-events: none;
    }

    .lettre {
      position: absolute;
      top: 25px;
      left: 30px;
      width: 200px;
      min-height: 130px;
      background-color: #fffdf7;
      border: 1px solid #eddede;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      padding: 18px 16px;
      box-sizing: border-box;
      transform: translateY(0px);
      opacity: 0;
      transition: transform 0.6s ease 0.5s, opacity 0.4s ease 0.5s;
      z-index: 3;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      color: #444;
      line-height: 1.5;
    }

    .scene.ouvert .lettre {
      transform: translateY(-95px);
      opacity: 1;
      z-index: 7;
    }

    p.astuce {
      font-size: 13px;
      color: #777;
      margin-top: 0;
      margin-bottom: 15px;
    }

    #reponses {
      display: none;
      gap: 10px;
      width: 100%;
    }

    #reponses.visible {
      display: flex;
    }

    .bouton-reponse {
      flex: 1;
      padding: 12px 0;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      color: white;
    }

    #btnOui {
      background-color: #2a9d8f;
    }
    #btnOui:hover {
      background-color: #21867a;
    }

    #btnNon {
      background-color: #e63946;
    }
    #btnNon:hover {
      background-color: #c1121f;
    }

    #confirmation {
      font-size: 14px;
      color: #2a9d8f;
      margin-top: 10px;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="carte">
    <h1>Tu as une lettre 💌</h1>

    <div class="scene" id="scene">
      <div class="lettre">
        Est-ce que tu as aimé l'idée ?
      </div>
      <div class="enveloppe-corps"></div>
      <div class="rabat"></div>
      <button class="sceau" id="sceau"><span>❤</span></button>
    </div>

    <p class="astuce" id="astuce">Appuie sur le sceau pour ouvrir l'enveloppe</p>

    <div id="reponses">
      <button class="bouton-reponse" id="btnOui">Oui</button>
      <button class="bouton-reponse" id="btnNon">Non</button>
    </div>

    <p id="confirmation"></p>
  </div>

  <script>
    const webhookURL = "TON_URL_WEBHOOK";

    document.getElementById("sceau").addEventListener("click", function() {
      document.getElementById("scene").classList.add("ouvert");
      setTimeout(function() {
        document.getElementById("astuce").style.display = "none";
        document.getElementById("reponses").classList.add("visible");
      }, 1100);
    });

    function envoyerReponse(reponse) {
      fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: "Réponse à la lettre : " + reponse })
      });
      document.getElementById("confirmation").innerText = "Merci pour ta réponse !";
      document.getElementById("reponses").classList.remove("visible");
    }

    document.getElementById("btnOui").addEventListener("click", function() {
      envoyerReponse("Oui ✅");
    });

    document.getElementById("btnNon").addEventListener("click", function() {
      envoyerReponse("Non ❌");
    });
  </script>

</body>
</html>
