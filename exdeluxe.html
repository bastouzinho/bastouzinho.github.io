<!DOCTYPE html>
<html>
<head>
  <title>Mon site</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f2f2f2;
    }

    .carte {
      display: none;
      flex-direction: column;
      align-items: center;
      background-color: white;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 320px;
    }

    .carte.active {
      display: flex;
    }

    .carte h1 {
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 22px;
      text-align: center;
      width: 100%;
    }

    .case {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      font-size: 16px;
      width: 100%;
      text-align: left;
    }

    .case input {
      margin-right: 10px;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .bouton {
      padding: 12px 25px;
      font-size: 16px;
      background-color: #e63946;
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      display: block;
      width: 100%;
      margin-bottom: 10px;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
    }

    .bouton:hover {
      background-color: #c1121f;
    }

    .confirmation {
      font-size: 14px;
      color: #2a9d8f;
      margin-top: 5px;
      min-height: 18px;
    }

    /* Styles du jeu */
    #jeu-container {
      position: relative;
      width: 100%;
      height: 200px;
      background-color: #cfe8f3;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      margin-bottom: 15px;
    }

    #joueur {
      position: absolute;
      bottom: 0;
      left: 30px;
      width: 30px;
      height: 30px;
      background-color: #e63946;
      border-radius: 5px;
    }

    #obstacle {
      position: absolute;
      bottom: 0;
      right: -20px;
      width: 20px;
      height: 30px;
      background-color: #333;
    }
  </style>
</head>
<body>

  <div id="zoneVideo"></div>

  <!-- PAGE 1 : ACCUEIL -->
  <div class="carte active" id="page-accueil">
    <h1>Tu me hais a combien sur 10</h1>
    <button class="bouton" onclick="allerA('page-contact')">1</button>
    <button class="bouton" onclick="allerA('page-contact')">10</button>
    <button class="bouton" onclick="allerA('page-contact')">1000</button>
    <p class="confirmation" id="confirmation-accueil"></p>
  </div>

  <!-- PAGE 2 : CASES A COCHER -->
  <div class="carte" id="page-contact">
    <h1>Tu trouves mon concept</h1>
    <label class="case">
      <input type="checkbox" id="case1"> Cool
    </label>
    <label class="case">
      <input type="checkbox" id="case2"> Tres cool
    </label>
    <label class="case">
      <input type="checkbox" id="case3"> Nul a chier mais vrm bcp trop trop trop (je suis juste une hateuse car t es un genie de faire ca pour moi)
    </label>
    <button class="bouton" onclick="envoyerReponses()">Envoyer</button>
    <p class="confirmation" id="confirmation-contact"></p>
  </div>

  <!-- PAGE 3 : LE JEU -->
  <div class="carte" id="page-jeu">
    <h1>Saute pour survivre !</h1>
    <div id="jeu-container">
      <div id="joueur"></div>
      <div id="obstacle"></div>
    </div>
    <p id="message-jeu" style="min-height:20px; font-size:14px;">Appuie sur ESPACE ou clique pour sauter</p>
    <button class="bouton" id="boutonSaut">Sauter</button>
  </div>

  <script>
    const webhookURL = "TON_URL_WEBHOOK";
    let musiqueLancee = false;

    function lancerMusique() {
      if (musiqueLancee) return;
      musiqueLancee = true;
      document.getElementById("zoneVideo").innerHTML =
        '<iframe width="1" height="1" style="border:none;" src="https://www.youtube.com/embed/mjen6N9o5nI?autoplay=1&start=0" allow="autoplay"></iframe>';
    }

    function allerA(idPage) {
      lancerMusique();
      document.querySelectorAll(".carte").forEach(c => c.classList.remove("active"));
      document.getElementById(idPage).classList.add("active");
      if (idPage === "page-jeu") demarrerJeu();
    }

    function envoyerReponses() {
      lancerMusique();
      const c1 = document.getElementById("case1").checked ? "✅ Cool" : "❌ Cool";
      const c2 = document.getElementById("case2").checked ? "✅ Tres cool" : "❌ Tres cool";
      const c3 = document.getElementById("case3").checked ? "✅ Nul a chier (mais elle t'adore en vrai)" : "❌ Nul a chier (mais elle t'adore en vrai)";
      const message = "Réponses reçues :\n" + c1 + "\n" + c2 + "\n" + c3;

      fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: message })
      });

      document.getElementById("confirmation-contact").innerText = "Merci, tes réponses ont bien été envoyées !";
      setTimeout(() => allerA("page-jeu"), 800);
    }

    // ----- LE JEU -----
    let jeuDemarre = false;

    function demarrerJeu() {
      if (jeuDemarre) return;
      jeuDemarre = true;

      const joueur = document.getElementById("joueur");
      const obstacle = document.getElementById("obstacle");
      const message = document.getElementById("message-jeu");
      const boutonSaut = document.getElementById("boutonSaut");

      let enSaut = false;
      let jeuFini = false;
      let vitesseObstacle = 2;
      let positionObstacle = 500;
      let dureeSurvie = 8000;
      let debut = Date.now();

      function sauter() {
        if (enSaut || jeuFini) return;
        enSaut = true;
        let hauteur = 0;
        let monte = true;

        const intervalSaut = setInterval(() => {
          if (monte) {
            hauteur += 5;
            if (hauteur >= 90) monte = false;
          } else {
            hauteur -= 5;
            if (hauteur <= 0) {
              hauteur = 0;
              monte = true;
              enSaut = false;
              clearInterval(intervalSaut);
            }
          }
          joueur.style.bottom = hauteur + "px";
        }, 16);
      }

      document.addEventListener("keydown", function(e) {
        if (e.code === "Space") sauter();
      });
      boutonSaut.addEventListener("click", sauter);

      const boucleJeu = setInterval(() => {
        if (jeuFini) return;

        positionObstacle -= vitesseObstacle;
        if (positionObstacle < -20) positionObstacle = 500;
        obstacle.style.right = (500 - positionObstacle) + "px";

        const joueurBottom = parseInt(joueur.style.bottom || "0");
        const collision = positionObstacle < 65 && positionObstacle > 35 && joueurBottom < 25;

        if (collision) {
          jeuFini = true;
          message.innerText = "Perdu ! Recharge la page pour réessayer.";
          clearInterval(boucleJeu);
          return;
        }

        if (Date.now() - debut > dureeSurvie) {
          jeuFini = true;
          message.innerText = "Bravo, tu as gagné !";
          clearInterval(boucleJeu);
        }
      }, 16);
    }
  </script>

</body>
</html>
